<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-labelledby="t d">
<title id="t">Raa'i pipeline</title>
<desc id="d">Raa'i pipeline: video input, YOLOv8 detection, BoT-SORT and Re-ID tracking, behavior analysis, offline RAG with a local LLM, bilingual report.</desc>
<defs>
<linearGradient id="gA" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6C8CFF"/><stop offset="1" stop-color="#4FD1C5"/></linearGradient>
<linearGradient id="gB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161F42"/><stop offset="1" stop-color="#111833"/></linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/></pattern>
</defs>
<rect x="0.5" y="0.5" width="899" height="199" rx="18" fill="#0B1020" stroke="#24305A"/><rect x="0.5" y="0.5" width="899" height="199" rx="18" fill="url(#grid)"/><text x="24" y="34" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11.5" fill="#4FD1C5" letter-spacing="2.5">RAA'I  ·  OFFLINE EDGE-AI PIPELINE</text><rect x="782" y="19" width="94" height="22" rx="11" fill="#0B1020" stroke="#4FD1C5" stroke-opacity="0.7"/><text x="829" y="34" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#4FD1C5">NO CLOUD</text><rect x="24.0" y="70" width="122" height="84" rx="12" fill="url(#gB)" stroke="#4FD1C5" stroke-opacity="0.8"/><text x="36.0" y="89" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#4FD1C5">01</text><text x="36.0" y="111" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#E6EAF5">Video input</text><text x="36.0" y="129" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8B97B8">livestock cameras</text><rect x="170.0" y="70" width="122" height="84" rx="12" fill="url(#gB)" stroke="#6C8CFF" stroke-opacity="0.8"/><text x="182.0" y="89" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#6C8CFF">02</text><text x="182.0" y="111" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#E6EAF5">YOLOv8</text><text x="182.0" y="129" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8B97B8">object detection</text><rect x="316.0" y="70" width="122" height="84" rx="12" fill="url(#gB)" stroke="#6C8CFF" stroke-opacity="0.8"/><text x="328.0" y="89" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#6C8CFF">03</text><text x="328.0" y="111" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#E6EAF5">BoT-SORT + Re-ID</text><text x="328.0" y="129" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8B97B8">track each animal</text><rect x="462.0" y="70" width="122" height="84" rx="12" fill="url(#gB)" stroke="#A78BFA" stroke-opacity="0.8"/><text x="474.0" y="89" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#A78BFA">04</text><text x="474.0" y="111" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#E6EAF5">Behavior</text><text x="474.0" y="129" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8B97B8">health monitoring</text><rect x="608.0" y="70" width="122" height="84" rx="12" fill="url(#gB)" stroke="#A78BFA" stroke-opacity="0.8"/><text x="620.0" y="89" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#A78BFA">05</text><text x="620.0" y="111" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#E6EAF5">Offline RAG</text><text x="620.0" y="129" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8B97B8">+ local LLM</text><rect x="754.0" y="70" width="122" height="84" rx="12" fill="url(#gB)" stroke="#F5B971" stroke-opacity="0.8"/><text x="766.0" y="89" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#F5B971">06</text><text x="766.0" y="111" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#E6EAF5">Bilingual report</text><text x="766.0" y="129" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8B97B8">for farmers &amp; vets</text><line x1="148.0" y1="112.0" x2="163.0" y2="112.0" stroke="#6C8CFF" stroke-width="1.6" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" values="16;0" dur="1.1s" repeatCount="indefinite"/></line><path d="M161.0,107.5 L168.0,112.0 L161.0,116.5" fill="none" stroke="#6C8CFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="294.0" y1="112.0" x2="309.0" y2="112.0" stroke="#6C8CFF" stroke-width="1.6" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" values="16;0" dur="1.1s" repeatCount="indefinite"/></line><path d="M307.0,107.5 L314.0,112.0 L307.0,116.5" fill="none" stroke="#6C8CFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="440.0" y1="112.0" x2="455.0" y2="112.0" stroke="#6C8CFF" stroke-width="1.6" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" values="16;0" dur="1.1s" repeatCount="indefinite"/></line><path d="M453.0,107.5 L460.0,112.0 L453.0,116.5" fill="none" stroke="#6C8CFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="586.0" y1="112.0" x2="601.0" y2="112.0" stroke="#6C8CFF" stroke-width="1.6" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" values="16;0" dur="1.1s" repeatCount="indefinite"/></line><path d="M599.0,107.5 L606.0,112.0 L599.0,116.5" fill="none" stroke="#6C8CFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="732.0" y1="112.0" x2="747.0" y2="112.0" stroke="#6C8CFF" stroke-width="1.6" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" values="16;0" dur="1.1s" repeatCount="indefinite"/></line><path d="M745.0,107.5 L752.0,112.0 L745.0,116.5" fill="none" stroke="#6C8CFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="85.0" y1="172" x2="815.0" y2="172" stroke="#24305A" stroke-dasharray="2 5"/><circle r="4" fill="#4FD1C5" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" path="M85.0,172 L815.0,172"/></circle><text x="450.0" y="186" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8B97B8">data flows from camera frames to a diagnostic report, entirely on local hardware</text>
