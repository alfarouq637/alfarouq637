<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-labelledby="t d">
<title id="t">Inspection system pipeline</title>
<desc id="d">Synthetic Blender data feeds a NumPy CNN and an FFT anomaly detector, fused into an explainable AI dashboard.</desc>
