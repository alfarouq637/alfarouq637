lvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8B97B8">signal analysis</text><rect x="538" y="108.0" width="150" height="76" rx="12" fill="url(#gB)" stroke="#F5B971" stroke-opacity="0.8"/><text x="550" y="127.0" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#F5B971">03</text><text x="550" y="149.0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#E6EAF5">Fusion</text><text x="550" y="167.0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8B97B8">combined verdict</text><rect x="726" y="108.0" width="150" height="76" rx="12" fill="url(#gB)" stroke="#F5B971" stroke-opacity="0.8"/><text x="738" y="127.0" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" fill="#F5B971">04</text><text x="738" y="149.0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#E6EAF5">Explainable AI</text><text x="738" y="167.0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#8B97B8">dashboard</text><line x1="194" y1="136.0" x2="245" y2="96.0" stroke="#6C8CFF" stroke-width="1.6" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" values="16;0" dur="1.1s" repeatCount="indefinite"/></line><path d="M243,91.5 L250,96.0 L243,100.5" fill="none" stroke="#6C8CFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="194" y1="156.0" x2="245" y2="196.0" stroke="#A78BFA" stroke-width="1.6" stroke-dasharray="4 4"><animate attributeName="stroke-dashoffset" values="16;0" dur="1.1s" repeatCount="indefinite"/></line><path d="M243,191.5 L250,196.0 L243,200.5" fill="none" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><line x1="464" y1="96.0" x2="531" y2="136.0" stroke="#6C8CFF" stroke-width="